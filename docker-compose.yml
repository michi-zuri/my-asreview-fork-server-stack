# =============================================================================
# docker-compose.yml  --  ASReview LAB server stack (Coolify-first).
# -----------------------------------------------------------------------------
# Two services: PostgreSQL + ASReview (Gunicorn). Traefik (Coolify's built-in
# proxy) terminates HTTPS and routes traffic directly to the asreview
# container on port 5006 — assign a domain to the `asreview` service in the
# Coolify UI and you're done.
#
# All configuration lives in .env (or Coolify's env-vars UI). Flask reads
# ASREVIEW_LAB_* env vars directly via app.config.from_prefixed_env.
# =============================================================================

services:

  asreview:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      # Composite values that need interpolation — declared here, not in .env.
      ASREVIEW_LAB_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgresql-18:5432/${POSTGRES_DB:?}
      ASREVIEW_LAB_API_URL: /
      ASREVIEW_PATH: /asreview_projects
    volumes:
      - project-folder:/asreview_projects
    command:
      - bash
      - -c
      - |
        set -uo pipefail
        echo "Waiting for database..."
        until python -c "import psycopg2, os; psycopg2.connect(os.environ['ASREVIEW_LAB_SQLALCHEMY_DATABASE_URI'].replace('+psycopg2','')).close()" 2>/dev/null; do
          sleep 2
        done
        echo "Database reachable."
        asreview auth-tool create-db || true
        exec gunicorn -w "${WORKERS:-2}" -b 0.0.0.0:5006 'asreview.webapp.app:create_app()'
volumes:
  project-folder:
  database-volume:
