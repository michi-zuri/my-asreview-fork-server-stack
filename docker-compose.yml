# =============================================================================
# docker-compose.yml  --  ASReview LAB server stack (Coolify-first).
# -----------------------------------------------------------------------------
# Two services: PostgreSQL + ASReview (Gunicorn). Traefik (Coolify's built-in
# proxy) terminates HTTPS and routes traffic directly to the asreview
# container on port 5006 — assign a domain to the `asreview` service in the
# Coolify UI and you're done.
#
# All configuration lives in .env (or Coolify's env-vars UI). Flask reads
# ASREVIEW_LAB_* env vars directly via app.config.from_prefixed_env.
# =============================================================================

services:

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB:?} -U ${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database-volume:/var/lib/postgresql/data

  asreview:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      # Composite values that need interpolation — declared here, not in .env.
      ASREVIEW_LAB_SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DB:?}
      ASREVIEW_LAB_API_URL: /
      ASREVIEW_PATH: /asreview_projects
    volumes:
      - project-folder:/asreview_projects
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        asreview auth-tool create-db
        asreview task-manager &
        exec gunicorn -w "${WORKERS:-4}" -b 0.0.0.0:5006 'asreview.webapp.app:create_app()'

volumes:
  project-folder:
  database-volume:
